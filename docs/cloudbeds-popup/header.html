<!-- --------------------------------------------------------------------------
     Horizons Sandhills -- "Your Farm Basket is On Us" promo pop-up
     PASTE INTO: Settings -> Booking Engine -> Customize -> Custom Header
     Paste as-is; this field takes HTML.

     The text below is a fallback only. popup.js owns the wording -- edit the
     COPY block at the top of that file and it overwrites everything here on
     load, so there is one place to change copy, not two.

     The photo below is a fallback too. popup.js owns it: if this block is
     stale or the dashboard strips the img, popup.js builds the figure itself.
     The URL is absolute because this runs on us2.cloudbeds.com, where a
     relative path would resolve against Cloudbeds.

     Ships with `hidden`: the markup is inert until popup.js opens it, so it
     can never cover the calendar before the timer fires.
-------------------------------------------------------------------------- -->
<div id="hs-farmbox" class="hs-farmbox" hidden>
  <div class="hs-farmbox__overlay" data-hs-close></div>

  <div
    class="hs-farmbox__card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="hs-farmbox-title"
    aria-describedby="hs-farmbox-body"
    tabindex="-1"
  >
    <button type="button" class="hs-farmbox__close" data-hs-close aria-label="Close offer">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
        <path d="M2.5 2.5l11 11m0-11l-11 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="hs-farmbox__figure" data-hs-figure>
      <img
        class="hs-farmbox__img"
        data-hs-img
        src="https://sandhills.gohorizons.com/images/sandhills/farm-basket.webp"
        width="460"
        height="230"
        alt="A wicker basket on the lawn holding red wine, peaches, grapes, a jar of honey and farmhouse cheese."
      />
    </div>

    <p class="hs-farmbox__eyebrow">
      <span class="hs-farmbox__rule" aria-hidden="true"></span>
      <span data-hs-eyebrow>Special stay offer</span>
    </p>

    <h2 class="hs-farmbox__title" id="hs-farmbox-title" data-hs-title>
      Your Farm Basket is On Us
    </h2>

    <p class="hs-farmbox__body" id="hs-farmbox-body" data-hs-body>
      Book a 2-night stay at Horizons Sandhills and enjoy a complimentary basket
      of fresh farm products during your stay.
    </p>

    <div class="hs-farmbox__actions">
      <button type="button" class="hs-farmbox__cta" data-hs-cta>Book your stay</button>

      <a
        class="hs-farmbox__cta hs-farmbox__cta--ghost"
        data-hs-whatsapp
        href="https://wa.me/17546679090"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="hs-farmbox__waglyph" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.25-1.38c1.36.74 2.92 1.16 4.79 1.16 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.79 14.06c-.24.68-1.19 1.24-1.95 1.4-.53.11-1.22.2-3.55-.76-2.98-1.23-4.9-4.24-5.05-4.44-.15-.2-1.21-1.61-1.21-3.07 0-1.46.76-2.17 1.03-2.47.27-.3.59-.37.79-.37h.57c.18 0 .43-.07.67.51.24.58.83 2.01.9 2.15.07.15.11.32.02.51-.09.18-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.29.28-.13.56.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.27.37-.22.62-.13.25.09 1.6.75 1.87.89.27.13.45.2.51.32.07.11.07.66-.17 1.34z"/>
        </svg>
        <span data-hs-whatsapp-label>Message us on WhatsApp</span>
      </a>
    </div>
  </div>
</div>
